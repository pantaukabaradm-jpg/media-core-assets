<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantauKabar - Segera Hadir</title>
    <meta name="description" content="PantauKabar akan segera hadir dengan berita dan informasi terupdate. Dapatkan pemberitahuan pertama saat kami meluncur!">
    
    <style>
        /* CSS Reset & Variable Super Ringan */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --accent-color: #e63946;
            --bg-overlay: rgba(15, 23, 42, 0.82);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a url('https://images.pantaukabar.com/placeholder-bg.jpg') center/cover no-repeat fixed;
            color: var(--text-light);
            text-align: center;
            padding: 1.5rem;
            position: relative;
        }

        /* Dark Overlay untuk Legibilitas Teks */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 650px;
            width: 100%;
            animation: fadeIn 1s ease-in-out;
        }

        /* Badge Status */
        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(230, 57, 70, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(230, 57, 70, 0.3);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        /* Tipografi */
        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--accent-color);
        }

        p.subtitle {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Countdown Timer */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0.5rem;
            border-radius: 12px;
        }

        .time-box .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .time-box .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Form Langganan */
        .subscribe-form {
            display: flex;
            gap: 0.5rem;
            max-width: 480px;
            margin: 0 auto 2rem;
        }

        .subscribe-form input[type="email"] {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .subscribe-form input[type="email"]::placeholder {
            color: #64748b;
        }

        .subscribe-form input[type="email"]:focus {
            border-color: var(--accent-color);
        }

        .subscribe-form button {
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            white-space: nowrap;
        }

        .subscribe-form button:hover {
            background: #d62839;
        }

        .subscribe-form button:active {
            transform: scale(0.98);
        }

        /* Footer */
        footer {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        /* Animasi Ringan */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsif Ponsel */
        @media (max-width: 480px) {
            .subscribe-form {
                flex-direction: column;
            }
            .countdown {
                gap: 0.5rem;
            }
            .time-box {
                padding: 0.75rem 0.25rem;
            }
            .time-box .number {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Badge -->
        <div class="badge">🚀 Segera Hadir</div>

        <!-- Judul Utama -->
        <h1>Pantau Berita Terkini di <span>PantauKabar</span></h1>
        
        <!-- Subjudul -->
        <p class="subtitle">Sajian informasi tepercaya, aktual, dan mendalam. Kami sedang mempersiapkan pengalaman terbaik untuk Anda.</p>

        <!-- Hitung Mundur (Countdown) -->
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Hari</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Jam</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Menit</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Detik</span>
            </div>
        </div>

        <!-- Form Notifikasi Email -->
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Terima kasih! Kami akan memberi tahu Anda saat peluncuran.');">
            <input type="email" placeholder="Masukkan email Anda..." required>
            <button type="submit">Beri Tahu Saya</button>
        </form>

        <!-- Footer -->
        <footer>
            &copy; 2026 PantauKabar.com — All Rights Reserved.
        </footer>
    </main>

    <!-- Script Countdown Super Ringan -->
    <script>
        // Tentukan tanggal peluncuran (Contoh: 30 Hari dari sekarang)
        const targetDate = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const d = Math.floor(difference / (1000 * 60 * 60 * 24));
                const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = d < 10 ? '0' + d : d;
                document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
                document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
                document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
